<div
    novalidate
    [formGroup]="screenFormGroup"
>
    <div [magic]="mgc.MemberSelection">
        <!-- MemberSelection Component -->
        <div class="member-selection-container">
            <div class="member-selection-content">

                <!-- Member Selection Table -->
                <div class="table-container">
                    <div class="example-container mat-elevation-z8">
                        <mat-table
                            #table
                            [dataSource]="dataSource"
                            [magic]="mgc.MemberSelectionTable"
                            class="container_border"
                            matSort
                            matSortDisableClear
                            (matSortChange)="tableService.sortData($event)"
                        >
                            <!-- Checkbox Column -->
                            <ng-container
                                [magic]="mgc.ColumnCheck"
                                [matColumnDef]="mgc.ColumnCheck"
                            >
                                <mat-header-cell *matHeaderCellDef>
                                    #
                                </mat-header-cell>
                                <mat-cell
                                    *matCellDef="let row"
                                    magicMark="magicTableRowContainer"
                                >
                                    <div
                                        style="display: flex; flex-direction: row"
                                        *ngIf="mg.ifRowCreated(row)"
                                    >
                                        <div
                                            [formGroup]="mg.getFormGroupByRow(row.rowId)"
                                            style="display: flex; flex-direction: row"
                                        >
                                            <mat-checkbox
                                                [magic]="mgc.CheckSelect"
                                                [formControlName]="mgc.CheckSelect"
                                                [rowId]="row.rowId"
                                                class="checkbox-input"
                                            >
                                            </mat-checkbox>
                                        </div>
                                    </div>
                                </mat-cell>
                            </ng-container>

                            <!-- Member Name Column -->
                            <ng-container
                                [magic]="mgc.ColumnMemberName"
                                [matColumnDef]="mgc.ColumnMemberName"
                            >
                                <mat-header-cell *matHeaderCellDef>
                                    Member Name
                                </mat-header-cell>
                                <mat-cell
                                    *matCellDef="let row"
                                    magicMark="magicTableRowContainer"
                                >
                                    <div
                                        style="display: flex; flex-direction: row"
                                        *ngIf="mg.ifRowCreated(row)"
                                    >
                                        <div
                                            [formGroup]="mg.getFormGroupByRow(row.rowId)"
                                            style="display: flex; flex-direction: row"
                                        >
                                            <label
                                                [magic]="mgc.MemberName"
                                                [rowId]="row.rowId"
                                                class="text-input"
                                            >
                                                {{mg.getValue(mgc.MemberName, row.rowId)}}
                                            </label>
                                        </div>
                                    </div>
                                </mat-cell>
                            </ng-container>

                            <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
                            <mat-row
                                *matRowDef="let row; columns: displayedColumns;"
                                class="table_row"
                                [ngClass]="{ 'selected': selection.isSelected(row)}"
                                [magicRow]="row?.rowId"
                                (click)="row? tableService.selectRow(row.rowId) : null"
                            >
                            </mat-row>
                        </mat-table>
                        <mat-paginator
                            #paginator
                            [pageSize]="10"
                            [pageSizeOptions]="[5, 10, 20]"
                            (page)="tableService.mgOnPaginateChange($event)"
                        >
                        </mat-paginator>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="form-actions">
                    <button
                        mat-raised-button
                        color="primary"
                        type="button"
                        [magic]="mgc.BtnSelect"
                        class="action-button button-primary"
                    >
                        Select
                    </button>
                    <button
                        mat-raised-button
                        type="button"
                        [magic]="mgc.BtnCancel"
                        class="action-button button-secondary"
                    >
                        Cancel
                    </button>
                </div>

            </div>
        </div>
    </div>
</div>
