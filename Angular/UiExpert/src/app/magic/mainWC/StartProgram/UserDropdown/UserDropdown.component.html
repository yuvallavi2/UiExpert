<!-- Import project styles -->
<link rel="stylesheet" href="/src/styles/project.css">

<div
    novalidate
    [formGroup]="screenFormGroup"
>
  <div [magic]="mgc.UserDropdown">
    <div class="user-dropdown-container">
      <div class="user-dropdown-content">
        <!-- User Info Section with Image and Updates -->
        <div class="user-info-section">
          <div class="notification-badge-wrapper">
            <button
              type="button"
              id="numberOfUpdates"
              [magic]="mgc.numberOfUpdates"
              class="notification-badge">
              30
            </button>
          </div>

          <div class="user-image-wrapper">
            <img
              id="userImage"
              [magic]="mgc.userImage"
              src=""
              alt="User Avatar"
              class="user-avatar">
          </div>
        </div>

        <!-- Messages Section -->
        <div class="dropdown-menu-item">
          <button
            type="button"
            id="numberOfMessages"
            [magic]="mgc.numberOfMessages"
            class="menu-button">
            <span class="menu-button-icon">📧</span>
            <span class="menu-button-text">Messages</span>
            <span class="menu-button-badge">30</span>
          </button>
        </div>

        <!-- Settings Section -->
        <div class="dropdown-menu-item">
          <button
            type="button"
            id="btnSettings"
            [magic]="mgc.btnSettings"
            class="menu-button">
            <span class="menu-button-icon">⚙️</span>
            <span class="menu-button-text">Settings</span>
          </button>
        </div>

        <!-- Divider -->
        <div class="dropdown-divider"></div>

        <!-- Logout Section -->
        <div class="dropdown-menu-item">
          <button
            type="button"
            id="btnLogOut"
            [magic]="mgc.btnLogOut"
            class="menu-button menu-button-logout">
            <span class="menu-button-icon">🚪</span>
            <span class="menu-button-text">Log Out</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
