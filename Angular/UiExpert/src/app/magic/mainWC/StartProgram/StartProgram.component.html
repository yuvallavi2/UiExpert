<div
    novalidate
    [formGroup]="screenFormGroup"
    style="height: 100vh; display: flex; flex-direction: column;"
>
    <!-- Main Content Area with Sidebar and Router Outlet -->
    <div
        style="display: flex; flex-direction: row; flex: 1; overflow: hidden;"
        [magic]="mgc.StartProgram"
    >
        <!-- Left Side Navigation Menu -->
        <div style="width: 250px; background-color: #fafafa; border-right: 1px solid #e0e0e0; overflow-y: auto; padding: 16px;">
            <h3 style="margin: 0 0 16px 0; color: #333;">Navigation</h3>

            <!-- Welcome Section -->
            <div style="margin-bottom: 24px;">
                <button
                    mat-raised-button
                    color="accent"
                    routerLink="/welcome"
                    routerLinkActive="active-link"
                    style="width: 100%; justify-content: flex-start;"
                >
                    Welcome
                </button>
            </div>

            <!-- Members Section -->
            <div style="margin-bottom: 24px;">
                <h4 style="margin: 0 0 8px 0; color: #666; font-size: 14px; font-weight: 600;">MEMBERS</h4>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <button
                        mat-raised-button
                        color="primary"
                        routerLink="/MList"
                        routerLinkActive="active-link"
                        style="width: 100%; justify-content: flex-start;"
                    >
                        Member List
                    </button>
                    <button
                        mat-raised-button
                        color="primary"
                        routerLink="/MCard"
                        routerLinkActive="active-link"
                        style="width: 100%; justify-content: flex-start;"
                    >
                        Member Card
                    </button>
                    <button
                        mat-raised-button
                        color="primary"
                        routerLink="/MContact"
                        routerLinkActive="active-link"
                        style="width: 100%; justify-content: flex-start;"
                    >
                        Member Contact
                    </button>
                </div>
            </div>

            <!-- Events Section -->
            <div style="margin-bottom: 24px;">
                <h4 style="margin: 0 0 8px 0; color: #666; font-size: 14px; font-weight: 600;">EVENTS</h4>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <button
                        mat-raised-button
                        color="primary"
                        routerLink="/EventList"
                        routerLinkActive="active-link"
                        style="width: 100%; justify-content: flex-start;"
                    >
                        Event List
                    </button>
                    <button
                        mat-raised-button
                        color="primary"
                        routerLink="/EventCard"
                        routerLinkActive="active-link"
                        style="width: 100%; justify-content: flex-start;"
                    >
                        Event Card
                    </button>
                    <button
                        mat-raised-button
                        color="primary"
                        routerLink="/RegisteredMembers"
                        routerLinkActive="active-link"
                        style="width: 100%; justify-content: flex-start;"
                    >
                        Registered Members
                    </button>
                    <button
                        mat-raised-button
                        color="primary"
                        routerLink="/MemberSelection"
                        routerLinkActive="active-link"
                        style="width: 100%; justify-content: flex-start;"
                    >
                        Member Selection
                    </button>
                </div>
            </div>

            <!-- Footer Text -->
            <div style="margin-top: auto; padding-top: 16px; border-top: 1px solid #e0e0e0;">
                <label [magic]="mgc.footerText" style="font-size: 12px; color: #666;">
                    {{mg.getValue(mgc.footerText) }}
                </label>
            </div>
        </div>

        <!-- Right Side Content Area (Router Outlet) -->
        <div style="flex: 1; overflow-y: auto; padding: 16px; background-color: #ffffff;">
            <router-outlet [magic]="mgc.SubformRout">
            </router-outlet>
        </div>
    </div>
</div>
