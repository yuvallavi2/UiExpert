<div
    novalidate
    [formGroup]="screenFormGroup"
    class="h-screen flex flex-col"
>
    <!-- Main Content Area with Sidebar and Router Outlet -->
    <div
        class="flex flex-row flex-1 overflow-hidden"
        [magic]="mgc.StartProgram"
    >
        <!-- Left Side Navigation Menu -->
        <div class="w-64 bg-gray-50 border-r border-gray-200 overflow-y-auto p-4">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">Navigation</h3>

            <!-- Welcome Section -->
            <div class="mb-6">
                <button
                    mat-raised-button
                    color="accent"
                    routerLink="/welcome"
                    routerLinkActive="active-link"
                    class="w-full justify-start"
                >
                    Welcome
                </button>
            </div>

            <!-- Members Section -->
            <div class="mb-6">
                <h4 class="text-xs font-semibold text-gray-600 mb-2 uppercase">Members</h4>
                <div class="flex flex-col gap-2">
                    <button
                        mat-raised-button
                        color="primary"
                        routerLink="/MList"
                        routerLinkActive="active-link"
                        class="w-full justify-start"
                    >
                        Member List
                    </button>
                    <button
                        mat-raised-button
                        color="primary"
                        routerLink="/MCard"
                        routerLinkActive="active-link"
                        class="w-full justify-start"
                    >
                        Member Card
                    </button>
                    <button
                        mat-raised-button
                        color="primary"
                        routerLink="/MContact"
                        routerLinkActive="active-link"
                        class="w-full justify-start"
                    >
                        Member Contact
                    </button>
                </div>
            </div>

            <!-- Events Section -->
            <div class="mb-6">
                <h4 class="text-xs font-semibold text-gray-600 mb-2 uppercase">Events</h4>
                <div class="flex flex-col gap-2">
                    <button
                        mat-raised-button
                        color="primary"
                        routerLink="/EventList"
                        routerLinkActive="active-link"
                        class="w-full justify-start"
                    >
                        Event List
                    </button>
                    <button
                        mat-raised-button
                        color="primary"
                        routerLink="/EventCard"
                        routerLinkActive="active-link"
                        class="w-full justify-start"
                    >
                        Event Card
                    </button>
                    <button
                        mat-raised-button
                        color="primary"
                        routerLink="/RegisteredMembers"
                        routerLinkActive="active-link"
                        class="w-full justify-start"
                    >
                        Registered Members
                    </button>
                    <button
                        mat-raised-button
                        color="primary"
                        routerLink="/MemberSelection"
                        routerLinkActive="active-link"
                        class="w-full justify-start"
                    >
                        Member Selection
                    </button>
                </div>
            </div>

            <!-- Footer Text -->
            <div class="mt-auto pt-4 border-t border-gray-200">
                <label [magic]="mgc.footerText" class="text-xs text-gray-600">
                    {{mg.getValue(mgc.footerText) }}
                </label>
            </div>
        </div>

        <!-- Right Side Content Area (Router Outlet) -->
        <div class="flex-1 overflow-y-auto p-4 bg-white">
            <router-outlet [magic]="mgc.SubformRout">
            </router-outlet>
        </div>
    </div>
</div>
