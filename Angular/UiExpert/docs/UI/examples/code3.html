<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Event</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#0da6f2",
            "background-light": "#f5f7f8",
            "background-dark": "#101c22",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill {
        font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex min-h-screen w-full flex-col group/design-root">
<div class="flex flex-1">
<aside class="flex flex-col w-64 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800">
<div class="flex flex-col justify-between flex-1 p-4">
<div class="flex flex-col gap-4">
<div class="flex items-center gap-3 px-2">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10" data-alt="Gradient circle in blue and purple tones" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBq7Vlnj04sOgJmDsrlJEC3m8PtaB8eVrqn1XSCTYKDwC-v-k1fhYwJgVzXJ6RSYIX-lEBUHksAWUGQn5ckN93W2KouinTaplBEBXhbRXsfqHVP04O1rxf8Fw9tW2n_Nr9pzowyphW_aZHzLFPmP8FwqhFwlYQl2dxxIlcMxy1JbssxRzUqc8HUOVXK40hamVbr2emjAGokLgvg2kb62kpduVRAEVWSi0ODei_9Cm8AeABVVyzpOvxNnZDMr6WJsVuPkByaxq7ZsSY");'></div>
<div class="flex flex-col">
<h1 class="text-gray-900 dark:text-white text-base font-medium leading-normal">Event Organizer</h1>
<p class="text-gray-500 dark:text-gray-400 text-sm font-normal leading-normal">organizer@email.com</p>
</div>
</div>
<nav class="flex flex-col gap-2 mt-4">
<a class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800" href="#">
<span class="material-symbols-outlined">dashboard</span>
<p class="text-sm font-medium leading-normal">Dashboard</p>
</a>
<a class="flex items-center gap-3 px-3 py-2 rounded-lg bg-primary/10 text-primary dark:bg-primary/20" href="#">
<span class="material-symbols-outlined fill">event</span>
<p class="text-sm font-medium leading-normal">Events</p>
</a>
<a class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800" href="#">
<span class="material-symbols-outlined">group</span>
<p class="text-sm font-medium leading-normal">Customers</p>
</a>
<a class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800" href="#">
<span class="material-symbols-outlined">settings</span>
<p class="text-sm font-medium leading-normal">Settings</p>
</a>
</nav>
</div>
<div class="flex flex-col gap-1">
<a class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800" href="#">
<span class="material-symbols-outlined">help_center</span>
<p class="text-sm font-medium leading-normal">Help Center</p>
</a>
</div>
</div>
</aside>
<main class="flex-1 p-6 lg:p-10">
<div class="max-w-7xl mx-auto">
<div class="flex flex-wrap items-center gap-2 mb-6">
<a class="text-gray-500 dark:text-gray-400 text-sm font-medium leading-normal hover:text-primary" href="#">Dashboard</a>
<span class="text-gray-500 dark:text-gray-400 text-sm font-medium leading-normal">/</span>
<a class="text-gray-500 dark:text-gray-400 text-sm font-medium leading-normal hover:text-primary" href="#">Events</a>
<span class="text-gray-500 dark:text-gray-400 text-sm font-medium leading-normal">/</span>
<span class="text-gray-900 dark:text-white text-sm font-medium leading-normal">Create Event</span>
</div>
<div class="flex flex-wrap justify-between items-center gap-4 mb-8">
<div class="flex flex-col gap-2">
<h1 class="text-gray-900 dark:text-white text-3xl font-bold leading-tight tracking-tight">Create a New Event</h1>
<p class="text-gray-500 dark:text-gray-400 text-base font-normal leading-normal">Fill in the details below to create your event.</p>
</div>
<div class="flex items-center gap-2">
<p class="text-sm font-medium text-gray-600 dark:text-gray-300">Publish Event</p>
<button aria-checked="true" class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent bg-primary transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:focus:ring-offset-background-dark" role="switch" type="button">
<span class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out translate-x-5"></span>
</button>
</div>
</div>
<div class="bg-white dark:bg-gray-900 p-8 rounded-xl shadow-sm">
<div class="grid grid-cols-1 lg:grid-cols-2 gap-x-8 gap-y-6">
<div class="flex flex-col gap-6">
<label class="flex flex-col">
<p class="text-gray-800 dark:text-gray-200 text-base font-medium leading-normal pb-2">Event Name</p>
<input class="form-input w-full rounded-lg text-gray-900 dark:text-white dark:placeholder:text-gray-500 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary dark:focus:border-primary h-12 placeholder:text-gray-400 px-4 text-base font-normal" placeholder="e.g., Annual Tech Conference" type="text" value=""/>
</label>
<label class="flex flex-col">
<p class="text-gray-800 dark:text-gray-200 text-base font-medium leading-normal pb-2">Date</p>
<div class="relative">
<input class="form-input w-full rounded-lg text-gray-900 dark:text-white dark:placeholder:text-gray-500 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary dark:focus:border-primary h-12 placeholder:text-gray-400 px-4 text-base font-normal pr-10" placeholder="Select a date" type="date" value=""/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500 pointer-events-none">calendar_today</span>
</div>
</label>
<div class="grid grid-cols-2 gap-4">
<label class="flex flex-col">
<p class="text-gray-800 dark:text-gray-200 text-base font-medium leading-normal pb-2">Start Time</p>
<input class="form-input w-full rounded-lg text-gray-900 dark:text-white dark:placeholder:text-gray-500 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary dark:focus:border-primary h-12 placeholder:text-gray-400 px-4 text-base font-normal" placeholder="10:00 AM" type="time" value=""/>
</label>
<label class="flex flex-col">
<p class="text-gray-800 dark:text-gray-200 text-base font-medium leading-normal pb-2">End Time</p>
<input class="form-input w-full rounded-lg text-gray-900 dark:text-white dark:placeholder:text-gray-500 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary dark:focus:border-primary h-12 placeholder:text-gray-400 px-4 text-base font-normal" placeholder="05:00 PM" type="time" value=""/>
</label>
</div>
<label class="flex flex-col">
<p class="text-gray-800 dark:text-gray-200 text-base font-medium leading-normal pb-2">Location</p>
<div class="relative">
<input class="form-input w-full rounded-lg text-gray-900 dark:text-white dark:placeholder:text-gray-500 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary dark:focus:border-primary h-12 placeholder:text-gray-400 px-4 text-base font-normal pl-10" placeholder="Search for a location" type="text" value=""/>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500 pointer-events-none">location_on</span>
</div>
</label>
</div>
<div class="flex flex-col gap-6">
<label class="flex flex-col">
<p class="text-gray-800 dark:text-gray-200 text-base font-medium leading-normal pb-2">Event Description</p>
<textarea class="form-textarea w-full rounded-lg text-gray-900 dark:text-white dark:placeholder:text-gray-500 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary dark:focus:border-primary placeholder:text-gray-400 p-4 text-base font-normal resize-none" placeholder="Tell your attendees about the event..." rows="6"></textarea>
</label>
<div class="grid grid-cols-2 gap-4">
<label class="flex flex-col">
<p class="text-gray-800 dark:text-gray-200 text-base font-medium leading-normal pb-2">Capacity</p>
<input class="form-input w-full rounded-lg text-gray-900 dark:text-white dark:placeholder:text-gray-500 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary dark:focus:border-primary h-12 placeholder:text-gray-400 px-4 text-base font-normal" min="0" placeholder="e.g., 500" type="number" value=""/>
</label>
<label class="flex flex-col">
<p class="text-gray-800 dark:text-gray-200 text-base font-medium leading-normal pb-2">Category</p>
<select class="form-select w-full rounded-lg text-gray-900 dark:text-white dark:placeholder:text-gray-500 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary dark:focus:border-primary h-12 px-4 text-base font-normal">
<option>Technology</option>
<option>Business</option>
<option>Arts &amp; Culture</option>
<option>Community</option>
</select>
</label>
</div>
</div>
<div class="lg:col-span-2 flex justify-end items-center gap-4 pt-6 border-t border-gray-200 dark:border-gray-700 mt-2">
<button class="px-6 py-3 rounded-lg text-base font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">Cancel</button>
<button class="px-6 py-3 rounded-lg text-base font-medium text-white bg-primary hover:bg-primary/90 transition-colors">Create Event</button>
</div>
</div>
</div>
</div>
</main>
</div>
</div>
</body></html>
