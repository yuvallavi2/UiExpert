<!DOCTYPE html>

<html class="dark" lang="ja"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>新規イベント作成</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#137fec",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
            },
            fontFamily: {
              "display": ["Manrope", "Noto Sans JP", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Manrope', 'Noto Sans JP', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark">
<div class="relative flex h-auto min-h-screen w-full flex-col font-display overflow-x-hidden">
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-white/10 px-10 py-3">
<div class="flex items-center gap-4 text-white">
<div class="size-5 text-primary">
<svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M24 4H6V17.3333V30.6667H24V44H42V30.6667V17.3333H24V4Z" fill="currentColor" fill-rule="evenodd"></path>
</svg>
</div>
<h2 class="text-white text-lg font-bold leading-tight tracking-[-0.015em]">イベント管理</h2>
</div>
<div class="flex flex-1 justify-end gap-8">
<div class="flex items-center gap-9">
<a class="text-white/80 hover:text-white transition-colors text-sm font-medium leading-normal" href="#">ダッシュボード</a>
<a class="text-white/80 hover:text-white transition-colors text-sm font-medium leading-normal" href="#">イベント一覧</a>
<a class="text-white/80 hover:text-white transition-colors text-sm font-medium leading-normal" href="#">設定</a>
</div>
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-primary text-white text-sm font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 transition-colors">
<span class="truncate">ログアウト</span>
</button>
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10 border-2 border-white/20" data-alt="User avatar image" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuB2J0aaetwp2D_hkQGkXeR7Z1FhnRp7QM7wYiH9rYbZvMHtpvQ1WqYjdv7l-PhJ_Eq-2qbm27uaO0Ge-bMBY4kdsd3CdHQA59Ty7ms0fRlANgGvwJyqkmWUsIesORrIhqLFGNL5SFj524xX1VHPkwu0AJkICkuAAKac5B-uq1rYmYiEgHudyvaEjuO5PsNPN8Fe3PxpydIxUxMBnILAEPud5I3-w2fY_pHlxVWjiUL3dwcbg4RLSsKabQtIwO3aPpXtSqwT6Frm21F_");'></div>
</div>
</header>
<main class="flex flex-1 justify-center py-10 px-4 sm:px-6 lg:px-8">
<div class="w-full max-w-3xl">
<div class="flex flex-wrap justify-between gap-3 p-4">
<h1 class="text-white text-4xl font-black leading-tight tracking-[-0.033em] min-w-72">新規イベント作成</h1>
</div>
<div class="mt-8 space-y-6 px-4">
<div class="flex flex-col gap-6">
<label class="flex flex-col w-full">
<p class="text-white/90 text-base font-medium leading-normal pb-2">イベント名</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-white focus:outline-0 focus:ring-2 focus:ring-primary focus:ring-opacity-50 border border-[#324d67] bg-[#192633] h-14 placeholder:text-[#92adc9] p-[15px] text-base font-normal leading-normal transition-colors" placeholder="イベント名を入力" value=""/>
</label>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-white/90 text-base font-medium leading-normal pb-2">日付</p>
<div class="flex w-full flex-1 items-stretch rounded-lg">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-white focus:outline-0 focus:ring-2 focus:ring-primary focus:ring-opacity-50 border border-[#324d67] bg-[#192633] h-14 placeholder:text-[#92adc9] p-[15px] rounded-r-none border-r-0 pr-2 text-base font-normal leading-normal transition-colors" placeholder="日付を選択" value=""/>
<div class="text-[#92adc9] flex border border-[#324d67] bg-[#192633] items-center justify-center px-3 rounded-r-lg border-l-0">
<span class="material-symbols-outlined text-2xl">calendar_today</span>
</div>
</div>
</label>
<label class="flex flex-col min-w-40 flex-1">
<p class="text-white/90 text-base font-medium leading-normal pb-2">場所</p>
<div class="flex w-full flex-1 items-stretch rounded-lg">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-white focus:outline-0 focus:ring-2 focus:ring-primary focus:ring-opacity-50 border border-[#324d67] bg-[#192633] h-14 placeholder:text-[#92adc9] p-[15px] rounded-r-none border-r-0 pr-2 text-base font-normal leading-normal transition-colors" placeholder="場所を入力" value=""/>
<div class="text-[#92adc9] flex border border-[#324d67] bg-[#192633] items-center justify-center px-3 rounded-r-lg border-l-0">
<span class="material-symbols-outlined text-2xl">location_on</span>
</div>
</div>
</label>
</div>
<label class="flex flex-col w-full">
<p class="text-white/90 text-base font-medium leading-normal pb-2">概要</p>
<textarea class="form-textarea flex w-full min-w-0 flex-1 resize-y overflow-hidden rounded-lg text-white focus:outline-0 focus:ring-2 focus:ring-primary focus:ring-opacity-50 border border-[#324d67] bg-[#192633] h-36 placeholder:text-[#92adc9] p-[15px] text-base font-normal leading-normal transition-colors" placeholder="イベントの概要を入力"></textarea>
</label>
</div>
<div class="flex justify-end items-center gap-4 pt-4">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-6 bg-transparent text-white/80 text-sm font-bold leading-normal tracking-[0.015em] border border-white/20 hover:bg-white/10 transition-colors">
<span class="truncate">キャンセル</span>
</button>
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-6 bg-primary text-white text-sm font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 transition-colors">
<span class="truncate">イベントを作成</span>
</button>
</div>
</div>
</div>
</main>
</div>
</body></html>
